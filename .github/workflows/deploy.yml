name: Deploy to GAS on Merge

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存関係のインストール
        run: npm ci

      - name: clasp 認証設定
        run: |
          mkdir -p ~/.clasprc
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: GAS への強制プッシュする。
        run: npx @google/clasp push -f